<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Yaumiyah Tracker – UKM L-SIP FKIP UNTIRTA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f7f3e8;--card:#fff;--tx:#1f3a2c;--mu:#667a6c;--g1:#2f5d46;--g2:#8fae93;--g3:#e3ece2;--ln:#dfe6d9;--bad:#b4533f;--ok:#2f7d4f;--warn:#b8892b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14201a;--card:#1c2c23;--tx:#e9efe6;--mu:#9fb3a5;--g1:#8fc3a0;--g2:#4d7a5c;--g3:#25382d;--ln:#2b4033}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:.2em 0}.w{max-width:1000px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:12px 0}
.btn{background:var(--g1);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}
.btn.o{background:none;color:var(--g1);border:1.5px solid var(--g1)}.btn.r{background:var(--bad)}.btn.s{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mu)}label.c{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}label.c input{width:auto}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.big{font-size:26px;font-weight:700;color:var(--g1)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid var(--ln);text-align:left}th{background:var(--g3)}.sc{overflow-x:auto}
.hero{text-align:center;padding:40px 16px;background:linear-gradient(var(--g3),var(--bg));border-radius:0 0 28px 28px}
.q{font-style:italic;color:var(--mu);min-height:3em}.tag{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}.ok{background:var(--ok)}.no{background:var(--bad)}.wn{background:var(--warn)}.mu{background:var(--mu)}
.bar{height:10px;background:var(--g3);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g1)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:6px 0;border-radius:8px;background:var(--g3);font-size:13px}.cal .f{background:var(--g1);color:#fff}.cal .a{background:var(--warn);color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:10px 0;color:var(--mu);font-size:12px}.nav .on{color:var(--g1);font-weight:700}
.side{display:flex;gap:8px;flex-wrap:wrap}.pie{width:110px;height:110px;border-radius:50%}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--g1);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
footer{text-align:center;color:var(--mu);font-size:12px;padding:24px 12px 80px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(min-width:800px){.admin{display:grid;grid-template-columns:190px 1fr;gap:16px}.admin .side{flex-direction:column}}
</style></head><body>
<div id="toast"></div><div id="app"></div>
<footer>UKM L-SIP FKIP UNTIRTA<br>Kabinet Dzulfikar | 2026–2027<br>YAUMIYAH TRACKER<br>Copyright © 2026–2027. All Rights Reserved.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="ISI_PROJECT_URL",SB_KEY="ISI_ANON_PUBLIC_KEY";
const START="2026-11-01",END="2027-04-30",MN=["Nov 2026","Des 2026","Jan 2027","Feb 2027","Mar 2027","Apr 2027"],MK=["2026-11","2026-12","2027-01","2027-02","2027-03","2027-04"];
const SH=["Subuh","Zuhur","Asar","Magrib","Isya"],QS=["Sesungguhnya bersama kesulitan ada kemudahan. (QS. Al-Insyirah: 6)","Amalan yang paling dicintai Allah adalah yang konsisten, walau sedikit.","Bersungguh-sungguhlah, dan Allah akan menunjukkan jalan-Nya. (QS. Al-Ankabut: 69)","Ingatlah Allah, niscaya hati menjadi tenteram. (QS. Ar-Ra’d: 28)"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toLocaleDateString("sv",{timeZone:"Asia/Jakarta"}),inP=d=>d>=START&&d<=END;
const dn=d=>new Date(d+"T12:00:00Z"),fd=d=>dn(d).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
const addD=(d,n)=>new Date(dn(d).getTime()+n*864e5).toISOString().slice(0,10),wk=d=>addD(d,-((dn(d).getUTCDay()+6)%7));
function range(a,b){const r=[];for(let d=a;d<=b;d=addD(d,1))r.push(d);return r}
const num=s=>parseFloat(String(s||"").replace(",","."))||0;
const S={view:"land",tab:"home",mon:0,at:"dash",D:null,q:"",grp:"",sel:null,qi:0};
const sb=supabase.createClient(SB_URL,SB_KEY);
const mkDoc=p=>({id:p.split("/").pop(),path:p,async get(){const{data}=await sb.from("kv").select("data").eq("path",p).maybeSingle();return{id:p.split("/").pop(),exists:!!data,data:()=>data&&data.data}},async set(d){const{error}=await sb.from("kv").upsert({path:p,data:d});if(error){toast("Gagal menyimpan: "+error.message);throw error}},async update(d){const g=await this.get();await this.set({...(g.data()||{}),...d})},async delete(){await sb.from("kv").delete().eq("path",p)}});
const DB={doc:mkDoc,collection:c=>({doc:id=>mkDoc(c+"/"+(id||crypto.randomUUID())),async get(){const{data}=await sb.from("kv").select("path,data").like("path",c+"/%");return{docs:(data||[]).map(r=>({id:r.path.slice(c.length+1),data:()=>r.data}))}}})};
let db,user,uid,prof,days={},M=[],P={},R={};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const dayOk=e=>e&&e.sh&&e.sh.filter(Boolean).length==5&&e.dzP&&e.dzS&&num(e.raw)>=2;
function stat(ds,a,b){const t=today(),e=b<t?b:t,L=range(a,e).filter(inP),T={sh:0,duha:0,qiyam:0,til:0,olr:0,sed:0,filled:0,H:0,I:0,S:0,A:0,dz:0,raw:0,okd:0,el:L.length,W:{}};
L.forEach(d=>{const x=ds[d]||{};if(x.att)T[{Hadir:"H",Izin:"I",Sakit:"S",Alpa:"A"}[x.att]]++;if(!x.rep)return;T.filled++;const w=wk(d),W=T.W[w]=T.W[w]||{duha:0,qiyam:0,til:0,olr:0,sed:0,n:0};W.n++;
const s=(x.sh||[]).filter(Boolean).length;T.sh+=s;if(x.duha){T.duha++;W.duha++}if(x.qiyam){T.qiyam++;W.qiyam++}T.til+=num(x.til);W.til+=num(x.til);if(x.olr){T.olr++;W.olr++}if(x.sed){T.sed++;W.sed++}T.raw+=num(x.raw);T.dz+=(x.dzP?1:0)+(x.dzS?1:0);if(dayOk(x))T.okd++});
T.wl=Object.entries(T.W).sort().map(([w,v])=>({w,...v,ok:v.duha>=3&&v.qiyam>=3&&v.til>=40&&v.olr>=1&&v.sed>=1}));T.pct=T.el?Math.round(T.filled/T.el*100):0;return T}
const bar=p=>`<div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>`;
async function boot(){app("<div class='w'><p>Memuat…</p></div>");
 const{data:{session}}=await sb.auth.getSession();if(!session)return go("auth");db=DB;user=1;uid=session.user.id;S.adm=!!(await sb.from("admins").select("uid").eq("uid",uid).maybeSingle()).data;
 if(db&&user){try{const p=await db.doc("profiles/"+uid).get();prof=p.exists?p.data():null;if(prof){const r=await db.doc("reports/"+uid).get();days=r.exists?(r.data().days||{}):{}}}catch(e){db=null}}
 setInterval(()=>{if(S.view=="land"){S.qi=(S.qi+1)%QS.length;const q=$("#q");if(q)q.textContent="“"+QS[S.qi]+"”"}},7000);go("land")}
function app(h){$("#app").innerHTML=h}
function go(v,t){S.view=v;if(t)S.tab=t;draw()}
const logo=`<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="var(--g1)"/><path d="M38 14a18 18 0 1 0 0 36 14 14 0 1 1 0-36z" fill="#f7f3e8"/><path d="M20 46h24" stroke="#f7f3e8" stroke-width="3"/></svg>`;
function draw(){const v=S.view;if(v=="auth")return authv();if(v=="land")return land();if(v=="mlogin")return mlogin();if(v=="alogin")return alogin();if(v=="member")return member();if(v=="admin")return admin()}
function authv(){app(`<div class="w" style="max-width:420px"><div class="card"><h2>Masuk ke Yaumiyah Tracker</h2><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><p><button class="btn" onclick="auth(0)">Masuk</button> <button class="btn o" onclick="auth(1)">Daftar akun baru</button></p><small style="color:var(--mu)">Anggota baru: daftar dahulu, lalu aktivasi dengan username dan kode akses dari admin. Lupa password: <a href="#" onclick="rst();return false">kirim tautan reset</a>.</small></div></div>`)}
async function auth(n){const c={email:$("#em").value.trim(),password:$("#pw").value},r=n?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);if(r.error)return toast(r.error.message);if(n&&!r.data.session)return toast("Cek email untuk konfirmasi, lalu masuk.");location.reload()}
async function rst(){const e=$("#em").value.trim();if(!e)return toast("Isi email dahulu.");await sb.auth.resetPasswordForEmail(e);toast("Tautan reset dikirim bila email terdaftar.")}
const out=()=>sb.auth.signOut().then(()=>location.reload());
function land(){app(`<div class="hero">${logo}<h3>UKM L-SIP FKIP UNTIRTA</h3><h1 style="font-size:34px;letter-spacing:2px">YAUMIYAH TRACKER</h1><p>Membangun Kebiasaan Baik, Menjaga Konsistensi Ibadah, dan Meningkatkan Kualitas Diri.</p><p><b>Periode: November 2026 – April 2027</b></p>
<div class="row" style="justify-content:center"><button class="btn" onclick="mgo()">LOGIN ANGGOTA</button><button class="btn o" onclick="go('alogin')">LOGIN ADMIN</button></div><p class="q" id="q">“${QS[S.qi]}”</p></div>
<div class="w"><div class="card"><h3>Tujuan Program Amalan Yaumiyah</h3><p>Membiasakan anggota menjaga sholat, tilawah, dzikir, dan amal sunnah secara konsisten selama enam bulan, dengan absensi harian dan pemantauan oleh mentor serta pengurus.</p></div></div>`)}
async function mgo(){if(!db)return toast("Silakan masuk terlebih dahulu.");if(prof&&prof.active!==false)return go("member","home");if(prof)return toast("Akun dinonaktifkan. Hubungi admin.");go("mlogin")}
function mlogin(){app(`<div class="w" style="max-width:420px"><div class="card"><h2>Login Anggota</h2><label>Username</label><input id="u"><label>Kode akses (dari admin)</label><input id="p" type="password"><p><button class="btn" onclick="mlog()">Masuk</button> <button class="btn o" onclick="go('land')">Kembali</button></p><small style="color:var(--mu)">Lupa kode? Minta admin membuat ulang kode akses Anda.</small></div></div>`)}
async function mlog(){const h=await sha($("#u").value.trim().toLowerCase()+":"+$("#p").value);const c=await db.doc("codes/"+h).get();if(!c.exists)return toast("Username atau kode salah.");const d=c.data();prof={...d,active:true};await db.doc("profiles/"+uid).set(prof);toast("Berhasil masuk");go("member","home")}
function alogin(){app(`<div class="w" style="max-width:420px"><div class="card"><h2>Login Admin</h2><p>Hanya akun yang terdaftar sebagai admin yang dapat masuk.</p><button class="btn" onclick="alog()">Masuk sebagai Admin</button> <button class="btn o" onclick="go('land')">Kembali</button></div></div>`)}
async function alog(){if(!db)return toast("Silakan masuk terlebih dahulu.");if(!S.adm)return toast("Akun ini bukan admin.");await loadAdmin();go("admin")}
/* ---- MEMBER ---- */
async function saveDays(m){await db.doc("reports/"+uid).set({days});toast(m)}
function member(){const t=today(),x=days[t]||{},pr=stat(days,START,END),nav=[["home","🏠","Beranda"],["abs","✅","Absen"],["lap","📖","Laporan"],["rek","📊","Rekap"]];
 app(`<div class="w"><div class="row"><b>${logo.replace(/64/g,"36")} Yaumiyah Tracker</b><button class="btn o s" style="margin-left:auto" onclick="out()">Keluar</button></div>${body(t,x,pr)}</div><div class="nav">${nav.map(n=>`<button class="${S.tab==n[0]?"on":""}" onclick="S.tab='${n[0]}';draw()">${n[1]}<br>${n[2]}</button>`).join("")}</div>`)}
function body(t,x,pr){if(S.tab=="home")return`<div class="card"><h2>${esc(prof.name)}</h2><p>Kelompok: ${esc(prof.group)} · ${esc(prof.major)} ${esc(prof.year)}<br>Mentor: ${esc(prof.mentor)}</p><p>${fd(t)}</p><p>Absensi hari ini: <span class="tag ${x.att?"ok":"no"}">${x.att||"Belum absen"}</span> Laporan: <span class="tag ${x.rep?"ok":"no"}">${x.rep?"Sudah":"Belum"}</span></p><p>Keterisian laporan: <b>${pr.pct}%</b> (${pr.filled}/${pr.el} hari)</p>${bar(pr.pct)}${!inP(t)?"<p>Di luar periode program (1 Nov 2026 – 30 Apr 2027).</p>":""}</div><div class="card"><h3>Riwayat terakhir</h3><div class="sc"><table><tr><th>Tanggal</th><th>Absen</th><th>Laporan</th></tr>${Object.keys(days).sort().reverse().slice(0,10).map(d=>`<tr><td>${d}</td><td>${days[d].att||"-"}</td><td>${days[d].rep?"✓":"-"}</td></tr>`).join("")}</table></div></div>`;
 if(S.tab=="abs")return`<div class="card"><h2>Absensi Harian</h2><p>${fd(t)}</p>${!inP(t)?"<p>Di luar periode program.</p>":x.att?`<p>Status tercatat: <b>${x.att}</b> pada ${new Date(x.attAt).toLocaleString("id-ID")}.</p><small>Perubahan hanya melalui admin.</small>`:`${["Hadir","Izin","Sakit","Alpa"].map(s=>`<label class="c"><input type="radio" name="at" value="${s}"> ${s}</label>`).join("")}<p><button class="btn" onclick="sAbs()">SIMPAN ABSENSI</button></p>`}</div>`;
 if(S.tab=="lap")return lap(t);return rek(pr)}
async function sAbs(){const v=document.querySelector("[name=at]:checked");if(!v)return toast("Pilih status dahulu.");const t=today();if(!inP(t)||(days[t]||{}).att)return toast("Tidak dapat absen.");days[t]={...days[t],att:v.value,attAt:new Date().toISOString()};await saveDays("Absensi tersimpan");draw()}
function lap(t){const d=S.ld&&inP(S.ld)&&S.ld<=t?S.ld:(inP(t)?t:START),x=days[d]||{},lock=x.rep&&d<addD(t,-1),f=lock?"disabled":"",ck=v=>v?"checked":"",c=(id,l,v)=>`<label class="c"><input type="checkbox" id="${id}" ${ck(v)} ${f}> ${l}</label>`,i=(id,l,v,ph)=>`<label>${l}</label><input id="${id}" value="${esc(v)}" placeholder="${ph||""}" ${f}>`;
 return`<div class="card"><h2>Laporan Amalan</h2><label>Tanggal</label><input type="date" min="${START}" max="${t<END?t:END}" value="${d}" onchange="S.ld=this.value;draw()">${lock?"<p><span class='tag wn'>Terkunci: batas edit 1 hari. Hubungi admin.</span></p>":""}
<h3>1. Sholat Wajib <small>(target 5 waktu/hari, diusahakan tepat waktu)</small></h3>${SH.map((s,k)=>c("sh"+k,s,(x.sh||[])[k])).join("")}
<h3>2. Sholat Duha <small>(min. 3×/minggu)</small></h3>${c("duha","Sudah dilaksanakan",x.duha)}${i("duhaN","Catatan",x.duhaN)}
<h3>3. Qiyamul Lail <small>(min. 3×/minggu)</small></h3>${c("qiyam","Sudah dilaksanakan",x.qiyam)}${i("qiyamN","Catatan",x.qiyamN)}
<h3>4. Tilawah Al-Qur’an <small>(min. 2 juz/minggu)</small></h3>${i("til","Jumlah lembar hari ini",x.til,"3L")}
<h3>5. Olahraga <small>(min. 1×/minggu)</small></h3>${c("olr","Sudah dilakukan",x.olr)}${i("olN","Jenis olahraga",x.olN)}
<h3>6. Dzikir Pagi dan Petang <small>(setiap hari)</small></h3>${c("dzP","Dzikir Pagi",x.dzP)}${c("dzS","Dzikir Petang",x.dzS)}
<h3>7. Sholat Sunnah Rawatib <small>(min. 2 rakaat/hari)</small></h3>${i("raw","Jumlah rakaat",x.raw,"2R")}
<h3>8. Sedekah <small>(min. 1×/minggu)</small></h3>${c("sed","Sudah dilakukan",x.sed)}${i("sedN","Nominal / bentuk (opsional)",x.sedN)}
<p><button class="btn" ${f} onclick="sLap('${d}')">${x.rep?"EDIT LAPORAN":"SIMPAN LAPORAN"}</button></p></div>`}
async function sLap(d){const g=id=>$("#"+id),ck=id=>g(id).checked,t=today();if(!inP(d)||d>t)return toast("Tanggal di luar periode.");const o=days[d]||{};if(o.rep&&d<addD(t,-1))return toast("Terkunci.");
 days[d]={...o,rep:true,savedAt:new Date().toISOString(),sh:SH.map((_,k)=>ck("sh"+k)),duha:ck("duha"),duhaN:g("duhaN").value,qiyam:ck("qiyam"),qiyamN:g("qiyamN").value,til:g("til").value,olr:ck("olr"),olN:g("olN").value,dzP:ck("dzP"),dzS:ck("dzS"),raw:g("raw").value,sed:ck("sed"),sedN:g("sedN").value};await saveDays("Laporan berhasil disimpan");draw()}
function recapHTML(ds){const [a,b]=range2(),s=stat(ds,a,b),pie=`conic-gradient(var(--g1) ${s.pct*3.6}deg,var(--g3) 0)`;
 const it=[["Sholat wajib",s.sh,Math.max(1,s.el*5)],["Dzikir",s.dz,Math.max(1,s.el*2)],["Rawatib ≥2R",s.okd?s.filled:0,Math.max(1,s.el)]];
 return`<div class="card"><div class="row"><div class="pie" style="background:${pie}"></div><div><b>${s.pct}%</b> keterisian laporan<br>${s.filled} dari ${s.el} hari · Hadir ${s.H} · Izin ${s.I} · Sakit ${s.S} · Alpa ${s.A}</div></div></div>
<div class="card"><h3>Pencapaian</h3>${it.map(r=>`<p>${r[0]}: ${r[1]}/${r[2]}${bar(r[1]/r[2]*100)}</p>`).join("")}<p>Duha ${s.duha}× · Qiyam ${s.qiyam}× · Tilawah ${s.til} lembar · Olahraga ${s.olr}× · Sedekah ${s.sed}×</p></div>
<div class="card"><h3>Target Mingguan</h3><div class="sc"><table><tr><th>Minggu</th><th>Duha</th><th>Qiyam</th><th>Tilawah</th><th>Olahraga</th><th>Sedekah</th><th>Status</th></tr>${s.wl.map(w=>`<tr><td>${w.w}</td><td>${w.duha}/3</td><td>${w.qiyam}/3</td><td>${w.til}/40L</td><td>${w.olr}/1</td><td>${w.sed}/1</td><td><span class="tag ${w.ok?"ok":"wn"}">${w.ok?"Target tercapai":"Belum mencapai target"}</span></td></tr>`).join("")||"<tr><td colspan=7>Belum mengisi laporan</td></tr>"}</table></div><small>Data yang belum diisi tidak dihitung sebagai amalan terlaksana. 2 juz ≈ 40 lembar.</small></div>
<div class="card"><h3>Kalender</h3><div class="cal">${range(a,b).map(d=>`<div class="${(ds[d]||{}).rep?"f":(ds[d]||{}).att?"a":""}" title="${d}">${+d.slice(8)}</div>`).join("")}</div><small>Hijau: laporan terisi · Kuning: hanya absen · Abu: belum mengisi</small></div>`}
function mSel(){return`<select onchange="S.mon=+this.value;draw()"><option value="-1" ${S.mon<0?"selected":""}>Keseluruhan 6 bulan</option>${MN.map((n,k)=>`<option value="${k}" ${S.mon==k?"selected":""}>${n}</option>`).join("")}</select>`}
function rek(){return`<h2>Rekap</h2>${mSel()}${recapHTML(days)}`}
/* ---- ADMIN ---- */
async function loadAdmin(){const [a,b,c]=await Promise.all([db.collection("members").get(),db.collection("profiles").get(),db.collection("reports").get()]);M=a.docs.map(d=>({id:d.id,...d.data()}));P={};b.docs.forEach(d=>P[d.data().mid]={uid:d.id,...d.data()});R={};c.docs.forEach(d=>R[d.id]=d.data().days||{})}
const mdays=m=>P[m.id]?(R[P[m.id].uid]||{}):{};
function admin(){const t=today(),tabs=[["dash","Dashboard"],["mem","Anggota"],["rek","Rekap & Unduh"]];
 app(`<div class="w"><div class="row"><b>Admin · Yaumiyah Tracker</b><button class="btn o s" style="margin-left:auto" onclick="out()">Keluar</button></div><div class="admin"><div class="side">${tabs.map(x=>`<button class="btn ${S.at==x[0]?"":"o"}" onclick="S.at='${x[0]}';S.sel=null;draw()">${x[1]}</button>`).join("")}</div><div>${S.sel?detail():aBody(t)}</div></div></div>`)}
const fl=()=>{const q=S.q.toLowerCase();return M.filter(m=>(!S.grp||m.group==S.grp)&&(!q||[m.name,m.group,m.major,m.year,m.mentor].join(" ").toLowerCase().includes(q)))};
function aBody(t){const A=M.filter(m=>m.active!==false),ab=A.filter(m=>mdays(m)[t]?.att).length,lp=A.filter(m=>mdays(m)[t]?.rep).length,grps=[...new Set(M.map(m=>m.group))];
 if(S.at=="dash"||S.at=="mem"){const L=fl(),srch=`<div class="row"><input style="flex:2" placeholder="Cari nama / kelompok / jurusan / angkatan" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(S.tm);S.tm=setTimeout(()=>{draw();$('#sq')?.focus()},400)" id="sq"><select style="flex:1" onchange="S.grp=this.value;draw()"><option value="">Semua kelompok</option>${grps.map(g=>`<option ${S.grp==g?"selected":""}>${esc(g)}</option>`).join("")}</select></div>`;
  const tb=`<div class="sc"><table><tr><th>Nama</th><th>Kelompok</th><th>Mentor</th><th>Absen</th><th>Lapor</th><th>%</th><th></th></tr>${L.map(m=>{const d=mdays(m),s=stat(d,START,END);return`<tr><td>${esc(m.name)}${m.active===false?" <span class='tag mu'>nonaktif</span>":""}<br><small>${esc(m.major)} ${esc(m.year)}${P[m.id]?"":" · belum aktivasi"}</small></td><td>${esc(m.group)}</td><td>${esc(m.mentor)}</td><td>${d[t]?.att||"-"}</td><td>${d[t]?.rep?"✓":"-"}</td><td>${s.pct}%</td><td><button class="btn s" onclick="S.sel='${m.id}';draw()">Detail</button>${S.at=="mem"?` <button class="btn s o" onclick="tog('${m.id}')">${m.active===false?"Aktifkan":"Nonaktifkan"}</button> <button class="btn s o" onclick="rc('${m.id}')">Kode baru</button> <button class="btn s r" onclick="del('${m.id}')">Hapus</button>`:""}</td></tr>`}).join("")}</table></div>`;
  if(S.at=="dash")return`<div class="grid"><div class="card">Total anggota<div class="big">${M.length}</div></div><div class="card">Sudah absen<div class="big">${ab}</div>Belum: ${A.length-ab}</div><div class="card">Sudah lapor<div class="big">${lp}</div>Belum: ${A.length-lp}</div></div><div class="card"><h3>Monitoring anggota</h3>${srch}${tb}</div>`;
  return`<div class="card"><h3>Tambah anggota</h3><div class="grid"><div><label>Nama</label><input id="n"></div><div><label>Username</label><input id="un"></div><div><label>Kelompok</label><input id="g"></div><div><label>Jurusan</label><input id="j"></div><div><label>Angkatan</label><input id="y"></div><div><label>Mentor</label><input id="mt"></div></div><p><button class="btn" onclick="addM()">Buat akun</button></p><div id="nc"></div></div><div class="card"><h3>Daftar anggota</h3>${srch}${tb}</div>`}
 return`<div class="card"><h3>Rekap & Unduh</h3>${mSel()}<label>Kelompok</label><select onchange="S.grp=this.value;draw()"><option value="">Semua</option>${grps.map(g=>`<option ${S.grp==g?"selected":""}>${esc(g)}</option>`).join("")}</select><p><button class="btn" onclick="csv()">Unduh Excel (CSV)</button> <button class="btn o" onclick="window.print()">Cetak</button></p></div>${recapTable()}`}
function range2(){const m=S.mon;return m<0?[START,END]:[MK[m]+"-01",MK[m]+"-"+String(new Date(+MK[m].slice(0,4),+MK[m].slice(5),0).getDate()).padStart(2,"0")]}
function rows(){const[a,b]=range2();return fl().map(m=>{const s=stat(mdays(m),a,b);return[m.name,m.group,m.mentor,m.major,m.year,s.H,s.I,s.S,s.A,s.filled,s.pct+"%",s.sh,s.dz,s.til,s.duha,s.qiyam,s.olr,s.sed]})}
const HD=["Nama","Kelompok","Mentor","Jurusan","Angkatan","Hadir","Izin","Sakit","Alpa","Hari lapor","% lapor","Sholat wajib","Dzikir","Tilawah (lembar)","Duha","Qiyam","Olahraga","Sedekah"];
function recapTable(){return`<div class="card sc"><table><tr>${HD.map(h=>`<th>${h}</th>`).join("")}</tr>${rows().map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`}
async function csv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[HD,...rows()].map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="rekap-yaumiyah.csv";a.click()}catch(e){toast("Gagal mengunduh.")}}
function detail(){const m=M.find(x=>x.id==S.sel),d=mdays(m),s=stat(d,START,END);return`<button class="btn o s" onclick="S.sel=null;draw()">← Kembali</button><div class="card"><h2>${esc(m.name)}</h2><p>${esc(m.group)} · ${esc(m.major)} ${esc(m.year)} · Mentor ${esc(m.mentor)}</p></div>${P[m.id]?`<div class="card"><h3>Koreksi absensi</h3><div class="row"><input type="date" id="cd" min="${START}" max="${END}" style="width:auto"><select id="cs" style="width:auto">${["Hadir","Izin","Sakit","Alpa"].map(x=>`<option>${x}</option>`).join("")}</select><button class="btn s" onclick="fix('${m.id}')">Simpan koreksi</button></div></div>`:"<div class='card'>Anggota belum aktivasi akun.</div>"}${recapHTML(d)}<div class="card sc"><h3>Riwayat harian</h3><table><tr><th>Tanggal</th><th>Absen</th><th>Sholat</th><th>Tilawah</th><th>Dzikir</th><th>Rawatib</th><th>Olahraga</th><th>Sedekah</th></tr>${Object.keys(d).sort().reverse().map(k=>{const x=d[k];return`<tr><td>${k}</td><td>${x.att||"-"}</td><td>${x.rep?(x.sh||[]).filter(Boolean).length+"/5":"-"}</td><td>${x.til||"-"}</td><td>${x.rep?(x.dzP?"P":"")+(x.dzS?"S":"")||"-":"-"}</td><td>${x.raw||"-"}</td><td>${x.olr?esc(x.olN||"✓"):"-"}</td><td>${x.sed?esc(x.sedN||"✓"):"-"}</td></tr>`}).join("")}</table></div>`}
async function fix(id){const d=$("#cd").value;if(!inP(d))return toast("Tanggal di luar periode.");const u=P[id].uid,o=R[u]||{};o[d]={...o[d],att:$("#cs").value,attAt:new Date().toISOString(),fixed:true};R[u]=o;await db.doc("reports/"+u).set({days:o});toast("Koreksi tersimpan");draw()}
async function addM(){const g=id=>$("#"+id).value.trim(),n=g("n"),un=g("un").toLowerCase();if(!n||!un)return toast("Nama dan username wajib.");const code=[...crypto.getRandomValues(new Uint8Array(6))].map(b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join(""),h=await sha(un+":"+code),info={name:n,username:un,group:g("g"),major:g("j"),year:g("y"),mentor:g("mt")},ref=db.collection("members").doc();
 await ref.set({...info,active:true,hash:h});await db.doc("codes/"+h).set({mid:ref.id,...info});M.push({id:ref.id,...info,active:true,hash:h});draw();$("#nc").innerHTML=`<div class="card">Bagikan ke ${esc(n)} — Username: <b>${esc(un)}</b> · Kode akses: <b>${code}</b><br><small>Kode hanya tampil sekali.</small></div>`}
async function rc(id){const m=M.find(x=>x.id==id),code=[...crypto.getRandomValues(new Uint8Array(6))].map(b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join(""),h=await sha(m.username+":"+code);await db.doc("codes/"+m.hash).delete();await db.doc("codes/"+h).set({mid:id,name:m.name,username:m.username,group:m.group,major:m.major,year:m.year,mentor:m.mentor});await db.doc("members/"+id).update({hash:h});m.hash=h;alert("Kode akses baru untuk "+m.name+": "+code)}
async function tog(id){const m=M.find(x=>x.id==id),v=m.active===false;await db.doc("members/"+id).update({active:v});if(P[id])await db.doc("profiles/"+P[id].uid).update({active:v});m.active=v;if(P[id])P[id].active=v;draw()}
async function del(id){const m=M.find(x=>x.id==id);if(!confirm("Hapus akun "+m.name+"? Data laporan tetap tersimpan, akun tidak dapat login."))return;await db.doc("codes/"+m.hash).delete();await db.doc("members/"+id).delete();if(P[id])await db.doc("profiles/"+P[id].uid).update({active:false});M=M.filter(x=>x.id!=id);draw()}
boot();
</script></body></html>
